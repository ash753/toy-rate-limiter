apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrinder-agent
  namespace: rate-limiter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ngrinder-agent
  template:
    metadata:
      labels:
        app: ngrinder-agent
    spec:
      containers:
        - name: ngrinder-agent
          image: ngrinder/agent:3.5.3
          args: ["ngrinder-controller:80"]
          env:
            - name: NGRINDER_CONTROLLER_HOST
              value: "ngrinder-controller"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dlogback.configurationFile=/opt/ngrinder-agent/logback.xml"
          resources:
            requests:
              memory: "2Gi"
              cpu: "2.0"
            limits:
              memory: "2Gi"
              cpu: "4.0"
          volumeMounts:
            - name: logback-config
              mountPath: /opt/ngrinder-agent/logback.xml
              subPath: logback.xml
      volumes:
        - name: logback-config
          configMap:
            name: ngrinder-agent-logback
