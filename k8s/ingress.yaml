apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rate-limiter-ingress
  namespace: rate-limiter
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  rules:
    - host: rate-limiter.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rate-limiter
                port:
                  number: 8080
    - host: ngrinder.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ngrinder-controller
                port:
                  number: 80
